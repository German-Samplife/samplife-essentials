# CJ-Kleidung (Skin 0) je Spieler im SA-MP-Client, als samp-cef-Plugin, siehe README.md.
# Gebaut wird nur von GitHub (.github/workflows/kleidung.yml) für i686-pc-windows-msvc.
[package]
name = "samplife-kleidung"
version = "0.8.0"
edition = "2021"
publish = false

[lib]
# ergibt samplife_kleidung.dll, der Workflow benennt sie in samplife-kleidung.dll um (für GTA/cef/plugins/)
name = "samplife_kleidung"
crate-type = ["cdylib"]

[dependencies]
# samp-client-api von ZOTTCE, genau der Stand, den samp-cef (client/Cargo.toml) benutzt
client-api = { git = "https://github.com/zottce/samp-client-api.git", rev = "d497ffad4903d9cc3f02869c744c3c3d96217cbb" }
winapi = { version = "0.3.9", features = ["minwindef", "winnt", "memoryapi", "processthreadsapi", "libloaderapi", "d3d9", "windef", "wingdi", "winver"] }

[profile.release]
opt-level = 2
codegen-units = 1
lto = true
debug = false
