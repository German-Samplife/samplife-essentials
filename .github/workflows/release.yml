# Baut den Launcher aus dem Quelltext dieses Repositorys und hängt ihn an ein Release.
# Auslöser: ein Tag wie v2.0.0. Bei Pushes auf andere Branches (Änderungen am Launcher) und von Hand wird nur gebaut,
# geprüft und es werden Bildschirmfotos des Fensters als Artefakt abgelegt. Ohne eigenen Tag-Push geht ein Release auch
# von Hand: Actions → Release → Run workflow auf main mit release_tag (z. B. v2.8.1). Dann legt der Lauf Tag und Release
# selbst an, auf genau dem Commit, den er gebaut hat (wie in cef.yml).
name: Release

on:
  push:
    tags:
      - "v*"
    branches-ignore:
      - main
    paths:
      - "src/**"
      - "test/**"
      - "bauen.cmd"
      - "app.manifest"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release anlegen mit diesem Tag, z. B. v2.8.1 (nur auf main, muss zur Version in src/Programm.cs passen; leer: nur bauen und prüfen)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  bauen:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # RELEASE_TAG: Name des Releases, leer bei reinen Prüfläufen. Beim Tag-Push der Tag selbst, beim Start von Hand
      # release_tag, aber nur auf main, im Schema v<Version> und nur, wenn es den Tag noch nicht gibt.
      - name: Release-Tag bestimmen
        shell: pwsh
        env:
          EINGABE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = ""
          if ("${{ github.ref_type }}" -eq "tag") {
            if ("${{ github.ref_name }}" -like "v*") { $tag = "${{ github.ref_name }}" }
          } elseif ($env:EINGABE_TAG) {
            $tag = $env:EINGABE_TAG.Trim()
            if ("${{ github.ref }}" -ne "refs/heads/main") { throw "Ein Release von Hand nur auf main, nicht auf ${{ github.ref }}" }
            if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw "Tag '$tag' passt nicht zum Schema v<Version>" }
            $vorhanden = git ls-remote --tags origin "refs/tags/$tag"
            if ($vorhanden) { throw "Den Tag $tag gibt es schon" }
          }
          "RELEASE_TAG=$tag" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          if ($tag) { "Release: $tag auf ${{ github.sha }}" } else { "Nur bauen und prüfen, kein Release" }

      - name: Version im Quelltext muss zum Tag passen
        if: env.RELEASE_TAG != ''
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG.TrimStart("v")
          $quelle = (Select-String -Path src/Programm.cs -Pattern 'public const string Version = "([^"]+)"').Matches[0].Groups[1].Value
          if ($tag -ne $quelle) { throw "Tag v$tag passt nicht zur Version $quelle in src/Programm.cs" }

      - name: Bauen
        shell: cmd
        run: bauen.cmd

      - name: Prüfen
        shell: pwsh
        run: python test/pruefen.py

      - name: Bildschirmfotos des Fensters
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force bilder | Out-Null
          # Kopfbild: das eigene Ladebild (ladebild/ auf main), nicht die Platzhalter-Screenshots der Website, damit die
          # Bilder auch für die Updates in der Community taugen; ohne Netz ohne Bild
          try { Invoke-WebRequest -Uri "https://raw.githubusercontent.com/German-Samplife/samplife-essentials/main/ladebild/samplife-ladebild.jpg" -OutFile "$env:RUNNER_TEMP\titelbild.jpg" } catch { }
          foreach ($zustand in "start", "gefunden", "bereit", "passwort", "einstellungen", "dateien", "laeuft", "mehr", "fertig", "offline", "fremd", "programme", "directx", "deinstalliert", "absturz", "absturzgesendet", "diagnose", "problem", "beendet", "eingefroren", "sampandere", "spielstart", "spiellaeuft") {
            # Haengt ein Zustand, nach 30 Sekunden abbrechen und weitermachen; Fehler schreibt der Launcher nach <Bild>.fehler.txt
            $p = Start-Process -PassThru -FilePath "ausgabe\Samplife Launcher.exe" -ArgumentList "--bildschirmfoto", "bilder\$zustand.png", "--zustand", $zustand, "--titelbild", "`"$env:RUNNER_TEMP\titelbild.jpg`""
            if (-not $p.WaitForExit(30000)) { Write-Host "Zustand $zustand hängt, abgebrochen"; Stop-Process -Id $p.Id -Force }
          }
          Get-ChildItem bilder
          Get-ChildItem bilder -Filter *.fehler.txt | ForEach-Object { Write-Host "==== $($_.Name)"; Get-Content $_.FullName }

      - uses: actions/upload-artifact@v4
        with:
          name: bildschirmfotos
          path: bilder/
          if-no-files-found: ignore

      - name: Datei für das Release vorbereiten
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          # Leerzeichen im Dateinamen macht GitHub zu Punkten; gleich so benennen, damit der Link in der README stimmt.
          # Dieselbe Datei zusätzlich unter dem alten Namen: Links auf .../latest/download/Samplife.Essentials.Installer.exe
          # führen so weiter auf eine Fassung, die funktioniert.
          Copy-Item "ausgabe\Samplife Launcher.exe" "release\Samplife.Launcher.exe"
          Copy-Item "ausgabe\Samplife Launcher.exe" "release\Samplife.Essentials.Installer.exe"
          $hash = (Get-FileHash "release\Samplife.Launcher.exe" -Algorithm SHA256).Hash.ToLower()
          $groesse = (Get-Item "release\Samplife.Launcher.exe").Length
          "$hash  Samplife.Launcher.exe`n$hash  Samplife.Essentials.Installer.exe" | Out-File -Encoding ascii "release\SHA256SUMS.txt"
          "SHA256=$hash" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "GROESSE=$groesse" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: launcher
          path: release/

      - name: Release anlegen
        if: env.RELEASE_TAG != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $text = @"
          Samplife Launcher $env:RELEASE_TAG

          Herunterladen, starten, GTA-Verzeichnis bestätigen, Namen eingeben, auf „Spielen" klicken. Der Launcher hält deine Dateien auf dem Stand des Servers und verbindet dich direkt. Die Datei ist nicht signiert; Windows SmartScreen fragt beim ersten Start nach („Weitere Informationen" → „Trotzdem ausführen").

          ``Samplife.Essentials.Installer.exe`` ist dieselbe Datei unter dem alten Namen, damit alte Links weiter funktionieren.

          Gebaut von GitHub aus dem Quelltext dieses Tags.

          SHA-256: ``$env:SHA256`` · Größe: $env:GROESSE Bytes (für den Block ``launcher`` im Manifest)
          "@
          # Beim Start von Hand gibt es den Tag noch nicht: gh legt ihn auf dem gebauten Commit an
          gh release create "$env:RELEASE_TAG" "release/Samplife.Launcher.exe" "release/Samplife.Essentials.Installer.exe" "release/SHA256SUMS.txt" --target "${{ github.sha }}" --title "Samplife Launcher $env:RELEASE_TAG" --notes $text --latest
