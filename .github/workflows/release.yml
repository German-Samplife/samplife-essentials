# Baut den Launcher aus dem Quelltext dieses Repositorys und hängt ihn an ein Release.
# Auslöser: ein Tag wie v2.0.0. Bei Pushes auf andere Branches (Änderungen am Launcher) und von Hand wird nur gebaut,
# geprüft und es werden Bildschirmfotos des Fensters als Artefakt abgelegt.
name: Release

on:
  push:
    tags:
      - "v*"
    branches-ignore:
      - main
    paths:
      - "src/**"
      - "test/**"
      - "bauen.cmd"
      - "app.manifest"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bauen:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version im Quelltext muss zum Tag passen
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $quelle = (Select-String -Path src/Programm.cs -Pattern 'public const string Version = "([^"]+)"').Matches[0].Groups[1].Value
          if ($tag -ne $quelle) { throw "Tag v$tag passt nicht zur Version $quelle in src/Programm.cs" }

      - name: Bauen
        shell: cmd
        run: bauen.cmd

      - name: Prüfen
        shell: pwsh
        run: python test/pruefen.py

      - name: Bildschirmfotos des Fensters
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force bilder | Out-Null
          # Kopfbild wie beim Spieler von der Website (liegt nicht im Repository); ohne Netz ohne Bild
          try { Invoke-WebRequest -Uri "https://www.german-samplife.de/hero/los-santos.jpg" -OutFile "$env:RUNNER_TEMP\titelbild.jpg" } catch { }
          foreach ($zustand in "start", "gefunden", "bereit", "passwort", "laeuft", "fertig", "offline") {
            Start-Process -Wait -FilePath "ausgabe\Samplife Launcher.exe" -ArgumentList "--bildschirmfoto", "bilder\$zustand.png", "--zustand", $zustand, "--titelbild", "`"$env:RUNNER_TEMP\titelbild.jpg`""
          }
          Get-ChildItem bilder

      - uses: actions/upload-artifact@v4
        with:
          name: bildschirmfotos
          path: bilder/
          if-no-files-found: ignore

      - name: Datei für das Release vorbereiten
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          # Leerzeichen im Dateinamen macht GitHub zu Punkten; gleich so benennen, damit der Link in der README stimmt.
          # Dieselbe Datei zusätzlich unter dem alten Namen: Links auf .../latest/download/Samplife.Essentials.Installer.exe
          # führen so weiter auf eine Fassung, die funktioniert.
          Copy-Item "ausgabe\Samplife Launcher.exe" "release\Samplife.Launcher.exe"
          Copy-Item "ausgabe\Samplife Launcher.exe" "release\Samplife.Essentials.Installer.exe"
          $hash = (Get-FileHash "release\Samplife.Launcher.exe" -Algorithm SHA256).Hash.ToLower()
          $groesse = (Get-Item "release\Samplife.Launcher.exe").Length
          "$hash  Samplife.Launcher.exe`n$hash  Samplife.Essentials.Installer.exe" | Out-File -Encoding ascii "release\SHA256SUMS.txt"
          "SHA256=$hash" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "GROESSE=$groesse" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: launcher
          path: release/

      - name: Release anlegen
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $text = @"
          Samplife Launcher ${{ github.ref_name }}

          Herunterladen, starten, GTA-Verzeichnis bestätigen, Namen eingeben, auf „Spielen" klicken. Der Launcher hält deine Dateien auf dem Stand des Servers und verbindet dich direkt. Die Datei ist nicht signiert; Windows SmartScreen fragt beim ersten Start nach („Weitere Informationen" → „Trotzdem ausführen").

          ``Samplife.Essentials.Installer.exe`` ist dieselbe Datei unter dem alten Namen, damit alte Links weiter funktionieren.

          Gebaut von GitHub aus dem Quelltext dieses Tags.

          SHA-256: ``$env:SHA256`` · Größe: $env:GROESSE Bytes (für den Block ``launcher`` im Manifest)
          "@
          gh release create "${{ github.ref_name }}" "release/Samplife.Launcher.exe" "release/Samplife.Essentials.Installer.exe" "release/SHA256SUMS.txt" --title "Samplife Launcher ${{ github.ref_name }}" --notes $text --latest
